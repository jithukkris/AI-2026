# Profile: claude  - real AI through Spring AI + Anthropic Claude API.
# Needs an API key from https://console.anthropic.com (billed separately from a Claude.ai plan).
spring:
  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${CLAUDE_MODEL:claude-haiku-5-5}
          max-tokens: 1024
          temperature: 0.1

app:
  ai:
    provider: claude
